name: Security (PR)

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  security:
    uses: ThomasJStumke/security-framework/.github/workflows/reusable-security-pr.yml@main
    with:
      application-id: vaultiq
      supabase-enabled: true
      fail-on-severity: high
      mc-security-url: ${{ vars.MC_SECURITY_URL }}
    secrets:
      MISSION_CONTROL_SECURITY_TOKEN: ${{ secrets.MISSION_CONTROL_SECURITY_TOKEN }}
